<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>仓库管理 - ai-code-wiki</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav>
    <span class="brand">AI·CODE WIKI</span>
    <a href="docs.html">文档列表</a>
    <a href="chat.html">智能问答</a>
    <a href="tasks.html">任务管理</a>
    <a href="impact.html">迭代影响</a>
    <a href="repos.html" class="active">仓库管理</a>
    <span class="spacer"></span>
    <span class="who" data-auth-user></span>
    <a class="logout" href="javascript:void(0)" onclick="logout()">登出</a>
  </nav>

  <div id="app" class="container">
    <!-- 注册代码仓库 -->
    <div class="panel">
      <h4>注册代码仓库</h4>
      <div class="row">
        <input v-model="form.repo_name" placeholder="仓库名（全局唯一）" style="flex:1;min-width:150px;">
        <input v-model="form.repo_url" placeholder="克隆地址（https/ssh/本地路径）" style="flex:2;min-width:260px;">
        <input v-model="form.default_branch" placeholder="默认分支（默认 main）" style="width:140px;">
        <button :disabled="submitting" @click="register">注册</button>
      </div>
      <div class="msg ok" v-if="regMsg">{{ regMsg }}</div>
    </div>

    <!-- 仓库列表 -->
    <div class="panel">
      <h4>仓库列表</h4>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>仓库名</th>
            <th>克隆地址</th>
            <th>默认分支</th>
            <th>状态</th>
            <th>注册时间</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody>
          <tr v-for="r in list" :key="r.id">
            <td>{{ r.id }}</td>
            <td>{{ r.repo_name }}</td>
            <td>{{ r.repo_url }}</td>
            <td>{{ r.default_branch }}</td>
            <td><span class="status" :class="r.status === 1 ? 'ok' : 'err'">{{ r.status === 1 ? '启用' : '停用' }}</span></td>
            <td>{{ formatTime(r.create_time) }}</td>
            <td>
              <button v-if="r.status === 1" class="btn-danger" :disabled="busyId === r.id" @click="setStatus(r, 2)">停用</button>
              <button v-else class="btn-ok" :disabled="busyId === r.id" @click="setStatus(r, 1)">启用</button>
            </td>
          </tr>
          <tr v-if="!loading && list.length === 0">
            <td colspan="7" class="empty">暂无仓库，请先注册</td>
          </tr>
        </tbody>
      </table>
      <div class="msg err" v-if="error">{{ error }}</div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="api.js"></script>
  <script src="auth.js"></script>
  <script>requireAuth();</script>
  <script src="repo.js"></script>
  <script>
    Vue.createApp({
      data() {
        return {
          form: { repo_name: '', repo_url: '', default_branch: 'main' },
          submitting: false,
          regMsg: '',
          busyId: 0,
          list: [],
          loading: false,
          error: ''
        };
      },
      methods: {
        async register() {
          if (!this.form.repo_name.trim() || !this.form.repo_url.trim()) { this.error = '仓库名与克隆地址不能为空'; return; }
          this.submitting = true; this.error = ''; this.regMsg = '';
          try {
            await apiRequest('/repo/register', { method: 'POST', body: JSON.stringify(this.form) });
            this.regMsg = '注册成功';
            this.load();
          } catch (e) { this.error = '注册失败: ' + e.message; }
          finally { this.submitting = false; }
        },
        async setStatus(r, status) {
          this.busyId = r.id; this.error = '';
          try {
            await apiRequest('/repo/' + r.id + '/status', { method: 'PUT', body: JSON.stringify({ status: status }) });
            r.status = status;
          } catch (e) { this.error = '操作失败: ' + e.message; }
          finally { this.busyId = 0; }
        },
        async load() {
          this.loading = true; this.error = '';
          try {
            this.list = await fetchRepos();
          } catch (e) { this.error = '加载仓库列表失败: ' + e.message; }
          finally { this.loading = false; }
        },
        formatTime(t) {
          return t ? String(t).replace('T', ' ').slice(0, 19) : '-';
        }
      },
      mounted() {
        this.load();
      }
    }).mount('#app');
  </script>
</body>
</html>
