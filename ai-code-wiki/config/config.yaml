# AI代码知识库系统 基础配置示例
server:
  name: ai-code-wiki
  port: 8080
  mode: debug # debug / release / test

# MySQL 数据库配置
mysql:
  host: 127.0.0.1
  port: 3306
  user: root
  password: root
  database: ai_code_wiki
  charset: utf8mb4
  max_idle_conns: 10
  max_open_conns: 100
  conn_max_lifetime: 3600 # 单位秒

# Git 仓库配置（代码解析任务使用）
git:
  repo_url: ""
  clone_dir: ./repo_cache
  default_branch: main

# 向量库配置
# 引擎驱动由 VECTOR_DRIVER 环境变量选择：chroma / milvus（默认 chroma）
vector:
  engine: "" # 向量引擎驱动：chroma / milvus（可由 VECTOR_DRIVER 环境变量覆盖）
  host: ""   # chroma: CHROMA_URL 解析出 host；milvus: MILVUS_HOST
  port: 0    # milvus: MILVUS_PORT，默认 19530
  collection: code_doc
  dim: 1536  # embedding 向量维度（milvus 建集合用，需与向量化服务输出一致；可由 MILVUS_DIM 覆盖）
  user: ""   # milvus 用户名（可选，开启鉴权时必填；MILVUS_USER）
  password: "" # milvus 密码（可选；MILVUS_PASSWORD）

# AI 大模型配置
llm:
  provider: "" # openai / ollama / deepseek 等
  base_url: ""
  api_key: ""
  model: ""
