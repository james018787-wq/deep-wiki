# AI代码知识库系统 基础配置示例
server:
  name: ai-code-wiki
  port: 8080
  mode: debug # debug / release / test

# MySQL 数据库配置
mysql:
  host: 127.0.0.1
  port: 3306
  user: root
  password: root
  database: ai_code_wiki
  charset: utf8mb4
  max_idle_conns: 10
  max_open_conns: 100
  conn_max_lifetime: 3600 # 单位秒

# 会话记忆 Redis（多轮对话存储；未配置地址时降级为进程内内存）
redis:
  addr: ""      # redis 连接地址，如 redis:6379（REDIS_ADDR）
  password: ""  # redis 密码（可选，REDIS_PASSWORD）
  db: 0         # 逻辑库编号（REDIS_DB）
  ttl_days: 7   # 会话过期天数（REDIS_TTL_DAYS）

# Git 仓库配置（代码解析任务使用）
# repo_url 为解析仓库地址，部署时可用 GIT_REPO_URL 覆盖
git:
  repo_url: ""
  clone_dir: ./repo_cache
  default_branch: main

# 向量库配置
# 引擎驱动由 VECTOR_DRIVER 环境变量选择：chroma / milvus（默认 chroma）
vector:
  engine: "" # 向量引擎驱动：chroma / milvus（可由 VECTOR_DRIVER 环境变量覆盖）
  host: ""   # chroma: CHROMA_URL 解析出 host；milvus: MILVUS_HOST
  port: 0    # milvus: MILVUS_PORT，默认 19530
  collection: code_doc
  dim: 1536  # embedding 向量维度（milvus 建集合用，需与向量化服务输出一致；可由 MILVUS_DIM 覆盖）
  user: ""   # milvus 用户名（可选，开启鉴权时必填；MILVUS_USER）
  password: "" # milvus 密码（可选；MILVUS_PASSWORD）

# 异步任务队列配置
# 驱动由 TASK_QUEUE_DRIVER 环境变量选择：memory（开发）/ rabbitmq（生产，默认 memory）
task_queue:
  driver: memory
  rabbitmq_url: "" # RabbitMQ 连接地址（amqp://user:pass@host:port/，RABBITMQ_URL）
  queue_name: ai-code-wiki-task
  max_retry: 3    # 任务最大重试次数（TASK_QUEUE_MAX_RETRY）
  concurrency: 2  # 消费协程数（TASK_QUEUE_CONCURRENCY）

# 解析流水线文件过滤规则（逗号分隔，环境变量可覆盖）
# 命中规则的文件跳过 AST 解析，不生成文档，并记录跳过日志
filter:
  ignore_dirs: 'vendor,node_modules,mock,fixture' # 忽略目录名（路径任意层级命中即跳过；FILTER_IGNORE_DIRS）
  ignore_file_re: '_test\.go$'                    # 忽略文件正则（匹配相对路径；FILTER_IGNORE_FILE_REGEX）
  allow_exts: 'go,php'                            # 允许的代码文件后缀，不含点（FILTER_ALLOW_EXTS）

# AI 大模型配置
llm:
  provider: "" # openai / ollama / deepseek 等
  base_url: ""
  api_key: ""
  model: ""
  timeout: 60 # LLM 调用超时（秒），LLM_TIMEOUT 覆盖
