<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1530"/>
      <stop offset="1" stop-color="#050914"/>
    </linearGradient>
    <linearGradient id="hub" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="64" height="64" rx="15" fill="url(#bg)"/>

  <!-- 光晕 -->
  <circle cx="32" cy="34" r="20" fill="url(#halo)"/>

  <!-- 调用边 -->
  <g stroke="#8aa3d0" stroke-width="1.6" stroke-linecap="round" opacity="0.6">
    <line x1="32" y1="34" x2="13" y2="20"/>
    <line x1="32" y1="34" x2="20" y2="50"/>
    <line x1="32" y1="34" x2="50" y2="18"/>
    <line x1="32" y1="34" x2="49" y2="47"/>
    <line x1="13" y1="20" x2="50" y2="18" opacity="0.4"/>
    <line x1="20" y1="50" x2="49" y2="47" opacity="0.4"/>
  </g>

  <!-- 知识图谱节点 -->
  <circle cx="13" cy="20" r="3" fill="#22d3ee"/>
  <circle cx="20" cy="50" r="3" fill="#8b5cf6"/>
  <circle cx="50" cy="18" r="3" fill="#22d3ee"/>
  <circle cx="49" cy="47" r="3" fill="#8b5cf6"/>
  <circle cx="31" cy="9" r="2" fill="#7dd3fc" opacity="0.8"/>

  <!-- AI 中枢节点 -->
  <circle cx="32" cy="34" r="8.5" fill="url(#hub)"/>
  <circle cx="32" cy="34" r="8.5" fill="none" stroke="#e0f2fe" stroke-opacity="0.4" stroke-width="1"/>

  <!-- AI 星光（四角星芒） -->
  <g transform="translate(41,21)" fill="#ffffff">
    <path d="M0 -7 C1.2 -3.4 3.4 -1.2 7 0 C3.4 1.2 1.2 3.4 0 7 C-1.2 3.4 -3.4 1.2 -7 0 C-3.4 -1.2 -1.2 -3.4 0 -7 Z"/>
  </g>
  <circle cx="44" cy="27" r="1.4" fill="#ffffff" opacity="0.9"/>
  <circle cx="30" cy="28" r="1" fill="#bae6fd" opacity="0.85"/>
</svg>
