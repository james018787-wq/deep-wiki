version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: ai-code-wiki-mysql
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "Wiki@2026"
      MYSQL_DATABASE: ai_code_wiki
      TZ: Asia/Shanghai
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./init_sql:/docker-entrypoint-initdb.d
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD","mysqladmin","ping","-uroot","-pWiki@2026"]
      interval: 10s
      timeout: 5s
      retries: 5

  chroma:
    image: chromadb/chroma:0.5.3
    container_name: ai-code-wiki-chroma
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./data/chroma:/chroma/chroma
    environment:
      TZ: Asia/Shanghai
      ALLOW_RESET: "true"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Go后端服务，本地开发可注释掉，在IDE运行；生产开启
  ai-code-wiki-api:
    build:
      context: ./ai-code-wiki
      dockerfile: Dockerfile
    container_name: ai-code-wiki-api
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      chroma:
        condition: service_healthy
      # API 健康检查探测 LLM 服务，需等 LLM 就绪后再启动，避免启动即 unhealthy
      ai-wiki-llm:
        condition: service_healthy
    # 健康检查：依赖 MySQL / LLM 服务连通，任一不可用返回 503 判为 unhealthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      TZ: Asia/Shanghai
      # 数据库配置
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: "Wiki@2026"
      DB_NAME: ai_code_wiki
      # chroma向量库地址
      CHROMA_URL: http://chroma:8000
      # Python llm服务地址
      LLM_SERVICE_URL: http://ai-wiki-llm:9000
      # 代码解析仓库（本地测试仓库，含 main / feature 分支）
      GIT_REPO_URL: /app/testrepo
      GIT_DEFAULT_BRANCH: main
    volumes:
      - ./repo_cache:/app/repo_cache
      - ./testrepo:/app/testrepo:ro
      # webstatic 前端目录挂载进容器，host 修改即生效，无需重建镜像
      - ./ai-code-wiki/webstatic:/app/webstatic:ro
    #开发阶段建议注释，本地IDE运行go；上线打开
#    deploy:
#      resources:
#        limits:
#          cpus: '2'
#          memory: 2G

  # Python LLM微服务
  ai-wiki-llm:
    build:
      context: ./ai-wiki-llm
      dockerfile: Dockerfile
    container_name: ai-wiki-llm
    restart: always
    ports:
      - "9000:9000"
    environment:
      TZ: Asia/Shanghai
      # 对话/文档生成：DeepSeek（OpenAI 兼容协议；密钥经 compose .env 注入 DEEPSEEK_API_KEY）
      OPENAI_API_KEY: "${DEEPSEEK_API_KEY}"
      OPENAI_BASE_URL: "https://api.deepseek.com/v1"
      LLM_MODEL: "deepseek-chat"
      # 向量化（embedding）：独立供应商，对话与向量互不干扰
      # DeepSeek 不提供 embedding，故单独指向硅基流动（OpenAI 兼容）
      EMBEDDING_BASE_URL: "https://api.siliconflow.cn/v1"
      EMBEDDING_API_KEY: "${SILICONFLOW_API_KEY}"
      EMBEDDING_MODEL: "BAAI/bge-large-zh-v1.5"
      # 多模型调度（/api/chat）：模型池见 ai-wiki-llm/model_pool.yaml，密钥经环境变量注入
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY}"
      # DASHSCOPE_API_KEY: "your-dashscope-key"
      # 分布式熔断/限流状态（启用上方 redis 服务后配置）
      # REDIS_ADDR: "redis:6379"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:9000/health',timeout=3).getcode()==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - ./ai-wiki-llm/logs:/app/logs
      # 挂载整个项目目录（只读）：model_pool.yaml 修改后约 5s 热重载生效，无需重建镜像。
      # 注意：挂载目录而非单文件——单文件 bind mount 绑定 inode，sed -i 等 rename 替换不可见。
      - ./ai-wiki-llm:/app:ro

  # 可选：生产环境异步任务队列（TASK_QUEUE_DRIVER=rabbitmq 时启用）
  # 需在 ai-code-wiki-api 环境变量中配置 RABBITMQ_URL 与 TASK_QUEUE_DRIVER=rabbitmq
  # rabbitmq:
  #   image: rabbitmq:3.13-management
  #   container_name: ai-code-wiki-rabbitmq
  #   restart: always
  #   ports:
  #     - "5672:5672"
  #     - "15672:15672"
  #   environment:
  #     TZ: Asia/Shanghai
  #   healthcheck:
  #     test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

  # 可选：多模型调度分布式熔断/限流状态存储（redis，归 ai-wiki-llm 使用）
  # 需在 ai-wiki-llm 环境变量中配置 REDIS_ADDR=redis:6379；不启用时熔断/限流降级 fail-open
  # redis:
  #   image: redis:7-alpine
  #   container_name: ai-code-wiki-redis
  #   restart: always
  #   ports:
  #     - "6379:6379"
  #   environment:
  #     TZ: Asia/Shanghai
  #   volumes:
  #     - ./data/redis:/data
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5